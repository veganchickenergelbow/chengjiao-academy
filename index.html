<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="成交学堂">
<meta name="theme-color" content="#FF6B57">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>成交学堂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#E4EEF6; --panel:#FFFFFF; --panel-2:#F3F7FB; --ink:#1E2B45; --ink-2:#56627C; --ink-3:#8793A8; --line:#D3DEE9;
  --coral:#FF6B57; --coral-d:#E4513D; --coral-2:#FFE3DD;
  --sun:#FFC23D; --sun-2:#FFF3D3; --mint:#1FB38E; --mint-d:#12906F; --mint-2:#D6F4EB;
  --amber:#D98A0B; --amber-2:#FFF0D4; --violet:#6F58F0; --violet-2:#ECE8FF; --red:#DE424A; --red-d:#B92F37; --red-2:#FDE2E3;
  --ice:#5B9BD5; --ice-2:#E1EEFA;
  --card:#FFFFFF; --off:#CBD5E1; --off-d:#AEB9C8; --tip-bg:#1E2B45; --tip-line:transparent;
  --mint-t:#0B7A5F; --red-t:#B92F37; --amber-t:#8C5A00; --violet-t:#4B36C4; --sun-t:#8A5A00;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --shadow:0 2px 0 rgba(30,43,69,.08), 0 10px 28px -14px rgba(30,43,69,.28);
  --f-ui:'Nunito','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-zh:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --f-disp:'Baloo 2','Nunito',system-ui,sans-serif;
  --f-logo:'ZCOOL KuaiLe','Noto Sans SC','PingFang SC',sans-serif;
}

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
  --bg:#121925; --panel:#1B2432; --panel-2:#232F42; --card:#212C3D; --ink:#E7EDF6; --ink-2:#AEB9CC; --ink-3:#7F8BA1; --line:#33415A;
  --coral:#FF7A66; --coral-d:#C4473A; --coral-2:#46292A; --sun:#FFC23D; --sun-2:#3B311A; --mint:#2CC49C; --mint-d:#1A9476; --mint-2:#163730;
  --amber:#F0A53A; --amber-2:#3A2F19; --violet:#8C79FF; --violet-2:#2A2650; --red:#F0565E; --red-d:#B93940; --red-2:#442229; --ice:#6FAEEC; --ice-2:#1D3147;
  --off:#3A475D; --off-d:#2A3547; --tip-bg:#0B111B; --tip-line:#3A475D;
  --mint-t:#72E2C2; --red-t:#FF9EA4; --amber-t:#F4C86F; --violet-t:#BDB1FF; --sun-t:#F6D27A;
  --shadow:0 2px 0 rgba(0,0,0,.28), 0 10px 28px -14px rgba(0,0,0,.7); } }
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#121925; --panel:#1B2432; --panel-2:#232F42; --card:#212C3D; --ink:#E7EDF6; --ink-2:#AEB9CC; --ink-3:#7F8BA1; --line:#33415A;
  --coral:#FF7A66; --coral-d:#C4473A; --coral-2:#46292A; --sun:#FFC23D; --sun-2:#3B311A; --mint:#2CC49C; --mint-d:#1A9476; --mint-2:#163730;
  --amber:#F0A53A; --amber-2:#3A2F19; --violet:#8C79FF; --violet-2:#2A2650; --red:#F0565E; --red-d:#B93940; --red-2:#442229; --ice:#6FAEEC; --ice-2:#1D3147;
  --off:#3A475D; --off-d:#2A3547; --tip-bg:#0B111B; --tip-line:#3A475D;
  --mint-t:#72E2C2; --red-t:#FF9EA4; --amber-t:#F4C86F; --violet-t:#BDB1FF; --sun-t:#F6D27A;
  --shadow:0 2px 0 rgba(0,0,0,.28), 0 10px 28px -14px rgba(0,0,0,.7); }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);line-height:1.15;text-wrap:balance;margin:0}
.zh{font-family:var(--f-zh)}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.hint{font-size:12.5px;color:var(--ink-3);font-weight:700}
.panel{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.btn{border:0;border-radius:16px;padding:13px 26px;font-family:var(--f-disp);font-weight:700;font-size:18px;background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coral-d)}
.btn:disabled{background:var(--off);box-shadow:0 4px 0 var(--off-d);color:#fff;cursor:default}
.btn.ok{background:var(--mint);box-shadow:0 4px 0 var(--mint-d)}
.btn.bad{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.ghost{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line)}
.btn .zh{font-weight:700}
.link{border:0;background:none;color:var(--ink-3);font-weight:800;font-size:13px;text-decoration:underline;padding:4px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px}
.hud-in{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--panel);border-radius:var(--r-lg);padding:8px 12px;box-shadow:var(--shadow)}
.logo{font-family:var(--f-logo);font-size:24px;line-height:1;color:var(--coral);border:0;background:none;padding:2px 4px}
.hud-mid{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.toggles{display:flex;gap:6px;margin-left:auto}
.tg{border:0;border-radius:99px;padding:6px 11px;font-size:13px;font-weight:800;background:var(--panel-2);color:var(--ink-3);box-shadow:inset 0 0 0 1.5px var(--line);display:flex;align-items:center;gap:5px}
.tg[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.tg svg{width:15px;height:15px}
.xbtn{border:0;background:none;width:34px;height:34px;border-radius:10px;color:var(--ink-3);display:grid;place-items:center}
.xbtn svg{width:20px;height:20px}
.prog{flex:1;height:14px;border-radius:99px;background:var(--panel-2);box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .4s ease;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.hearts{display:flex;align-items:center;gap:2px;font-weight:800;color:var(--red)}
.hearts svg{width:18px;height:18px}
.hearts .off{color:var(--off)}
.hearts .lbl{font-family:var(--f-zh);font-size:12px;color:var(--ink-2);margin-right:4px}

/* ruby words + tooltip */
.zb{border-radius:8px}
.zb .z{font-family:var(--f-zh);font-weight:500;display:block;line-height:1.65}
.show-py .zb .z,.zb.open .z{line-height:2.15}
.zb .e{display:none;font-size:13.5px;line-height:1.4;color:var(--ink-2);margin-top:2px}
.show-en .zb .e,.zb.open .e{display:block}
.zb.noen .e{display:none!important}
ruby.w{ruby-position:over;cursor:help;border-radius:5px;padding:0 1px;transition:background .12s}
ruby.w:hover,ruby.w.on{background:var(--sun-2)}
ruby.w rt{display:none;font-family:var(--f-ui);font-size:.46em;font-weight:700;color:var(--ink-3);opacity:.85;letter-spacing:-.01em;user-select:none}
.show-py ruby.w rt,.zb.open ruby.w rt{display:ruby-text}
.hid{visibility:hidden}
.cursor::after{content:'▍';color:var(--coral);animation:blink .8s steps(2) infinite;font-weight:400}
@keyframes blink{50%{opacity:0}}
#tip{position:fixed;z-index:50;max-width:260px;background:var(--tip-bg);border:1px solid var(--tip-line);color:#fff;border-radius:12px;padding:8px 12px;box-shadow:0 10px 30px -10px rgba(30,43,69,.6);pointer-events:none;display:grid;gap:1px}
#tip[hidden]{display:none!important}
#tip b{font-family:var(--f-zh);font-size:20px;font-weight:700;line-height:1.3}
#tip i{font-style:normal;color:#FFC9BF;font-weight:800;font-size:14px}
#tip span{font-size:13px;line-height:1.35;color:#E3E9F2}
.say{border:0;width:38px;height:38px;border-radius:12px;background:var(--ice-2);color:var(--ice);display:inline-grid;place-items:center;flex:none;vertical-align:middle}
.say svg{width:20px;height:20px}

/* home */
.home{display:grid;gap:14px;margin-top:4px}
.career{padding:18px 20px;display:grid;gap:12px}
.career-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.rank{font-family:var(--f-zh);font-weight:700;font-size:22px}
.rank small{display:block;font-family:var(--f-ui);font-size:12px;color:var(--ink-3);font-weight:800}
.quota{flex:1;min-width:200px;display:grid;gap:4px}
.quota .row{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--ink-2)}
.quota .row b{font-family:var(--f-disp);font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.qbar{height:12px;border-radius:99px;background:var(--panel-2);box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--coral));border-radius:99px}
.leads{display:flex;align-items:center;gap:12px;padding:14px 18px;flex-wrap:wrap}
.leads .ico{width:44px;height:44px;border-radius:14px;background:var(--ice-2);color:var(--ice);display:grid;place-items:center;flex:none}
.leads .ico svg{width:26px;height:26px}
.leads .txt{flex:1;min-width:180px}
.leads .txt b{font-family:var(--f-zh);font-size:16px}
.leads .txt div{font-size:13px;color:var(--ink-2)}
.leads .btn{font-size:15px;padding:9px 18px;border-radius:12px;background:var(--ice);box-shadow:0 3px 0 #3F7DB8}
.units{display:grid;gap:14px}
.unit{display:grid;gap:4px}
.unit-h{width:100%;border:0;text-align:left;padding:16px 20px;border-radius:var(--r-lg);background:var(--coral);color:#fff;display:flex;gap:12px;align-items:center;box-shadow:0 4px 0 var(--coral-d)}
.unit-h .eyebrow{color:rgba(255,255,255,.8)}
.unit-h.won{background:var(--mint);box-shadow:0 4px 0 var(--mint-d)}
.unit-h.locked{background:var(--panel-2);color:var(--ink-3);box-shadow:inset 0 0 0 2px var(--line);cursor:default}
.unit-h.locked .eyebrow{color:var(--ink-3)}
.uh-txt{flex:1;min-width:0}
.uh-side{display:flex;align-items:center;gap:10px;flex:none}
.uh-st{font-size:12px;font-weight:800;background:rgba(255,255,255,.2);border-radius:99px;padding:4px 10px;white-space:nowrap}
.unit-h.locked .uh-st{background:var(--panel)}
.chev{font-size:18px;line-height:1}
@media (max-width:640px){ .unit-h{flex-wrap:wrap} .uh-side{width:100%;justify-content:space-between} }
.unit-h h2{font-size:22px}
.unit-h .zh{font-weight:700}
.unit-h p{margin:2px 0 0;font-size:13px;opacity:.92;font-weight:700}
.path{display:grid;justify-items:center;gap:16px;padding-block:14px 8px;overflow:hidden}
.pnode{display:flex;align-items:center;gap:14px;width:min(100%,380px);transform:translateX(calc(var(--x) - 50px))}
@media (max-width:640px){.pnode{transform:translateX(calc(var(--x) * .3));width:calc(100% - 36px)}}
.pbtn{flex:none;width:76px;height:70px;border-radius:50%;border:0;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:26px;color:#fff;background:var(--off);box-shadow:0 6px 0 var(--off-d);position:relative}
.pbtn svg.ck{width:34px;height:34px}
.pbtn.done{background:var(--sun);box-shadow:0 6px 0 #D69E1E}
.pbtn.cur{background:var(--coral);box-shadow:0 6px 0 var(--coral-d)}
.pbtn.cur::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--coral);opacity:.35;animation:ring 1.6s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.07);opacity:.15}}
.pbtn.boss{width:88px;height:82px;overflow:hidden;background:var(--panel);box-shadow:0 6px 0 var(--off-d),inset 0 0 0 4px var(--off)}
.pbtn.boss.cur{box-shadow:0 6px 0 var(--coral-d),inset 0 0 0 4px var(--coral)}
.pbtn.boss.done{box-shadow:0 6px 0 #D69E1E,inset 0 0 0 4px var(--sun)}
.pbtn.boss svg{width:88px;height:100px;margin-top:14px}
.pbtn:disabled{cursor:default}
.plabel b{display:block;font-family:var(--f-zh);font-size:17px}
.plabel span{font-size:13px;color:var(--ink-2);font-weight:700}
.plabel .st{display:inline-block;margin-top:3px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.teasers{display:grid;gap:8px}
.teaser{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:var(--r-md);background:var(--panel-2);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-3);font-weight:700}
.teaser b{font-family:var(--f-zh);color:var(--ink-2)}
.teaser svg{width:16px;height:16px;flex:none}
.foot{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding-top:6px}

/* lesson */
.lesson{display:grid;gap:18px;margin-top:6px;padding-bottom:45vh}
.q-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.q-h h2{font-size:24px}
.q-h .zh{font-size:15px;color:var(--ink-3);font-weight:700}
.card{padding:18px 20px}
.intro-word{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.intro-word .zb .z{font-size:36px;font-weight:700}
.intro-word .en{font-family:var(--f-disp);font-size:20px;font-weight:700;color:var(--ink-2)}
.newtag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sun-t);background:var(--sun-2);border-radius:99px;padding:3px 10px}
.example{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding-top:14px;border-top:1.5px dashed var(--line)}
.example .zb .z{font-size:19px}
.note{margin:12px 0 0;padding:10px 12px;border-radius:var(--r-sm);background:var(--panel-2);font-size:14px;color:var(--ink-2)}
.prompt{display:flex;gap:12px;align-items:flex-start}
.prompt .zb .z{font-size:22px}
.prompt .en-big{font-family:var(--f-disp);font-size:22px;font-weight:700}
.bubble-row{display:flex;gap:10px;align-items:flex-end}
.av{width:54px;height:62px;flex:none;border-radius:16px;background:var(--panel-2);overflow:hidden}
.av svg{width:54px;height:64px;display:block}
.sbub{position:relative;background:var(--card);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);flex:1}
.sbub .zb .z{font-size:19px}
.choices{display:grid;gap:10px}
.choices.grid2{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.ch{position:relative;text-align:left;border:0;background:var(--panel);border-radius:var(--r-md);padding:12px 14px 12px 50px;box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line);min-height:52px;transition:transform .08s}
.ch:hover{background:var(--panel-2)}
.ch .k{position:absolute;left:12px;top:12px;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:13px;color:var(--ink-3);box-shadow:inset 0 0 0 1.5px var(--line)}
.ch .enl{font-weight:700;font-size:16px}
.ch .zb .z{font-size:17px}
.ch .sub{display:block;font-size:12.5px;color:var(--ink-3);font-weight:700}
.ch.sel{background:var(--ice-2);box-shadow:inset 0 0 0 2.5px var(--ice),0 3px 0 var(--ice)}
.ch.sel .k{color:var(--ice);box-shadow:inset 0 0 0 1.5px var(--ice)}
.ch.right{background:var(--mint-2);box-shadow:inset 0 0 0 2.5px var(--mint),0 3px 0 var(--mint)}
.ch.wrong{background:var(--red-2);box-shadow:inset 0 0 0 2.5px var(--red),0 3px 0 var(--red)}
.ch:disabled{cursor:default}
.blunt{display:flex;gap:10px;align-items:baseline;padding:10px 14px;border-radius:var(--r-md);background:var(--red-2)}
.blunt .lbl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--red-t);flex:none}
.blunt .zb .z{text-decoration:line-through;text-decoration-color:rgba(222,66,74,.5);font-size:17px}
.slot{display:inline-block;min-width:64px;border-bottom:3px solid var(--ink-3);margin:0 4px;text-align:center;color:var(--ice);font-weight:700}
.slot.filled{border-color:var(--ice)}
/* build */
.ansline{min-height:64px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.tile{border:0;background:var(--card);border-radius:12px;padding:8px 14px;box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line);font-family:var(--f-zh);font-size:19px;font-weight:500}
.tile.used{visibility:hidden}
.tile rt{font-size:.5em}
/* type */
.typebox{display:grid;gap:12px}
.typebox .target .z{font-size:30px;letter-spacing:.06em}
.typebox .target ruby.w.hit{color:var(--mint)}
.typebox .target .pu{color:var(--ink-3)}
.tin{width:100%;font:inherit;font-size:20px;font-weight:700;padding:14px 16px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--card);color:var(--ink);letter-spacing:.03em}
.tin:focus{border-color:var(--ice);outline:none}
.tin.bad{border-color:var(--red)}
/* pairs */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:grid;gap:10px}
.pc{border:0;background:var(--card);border-radius:var(--r-md);padding:12px;min-height:56px;box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line);font-weight:700;font-size:15px}
.pc.zhc{font-family:var(--f-zh);font-size:20px;font-weight:500}
.pc.sel{background:var(--ice-2);box-shadow:inset 0 0 0 2.5px var(--ice),0 3px 0 var(--ice)}
.pc.done{opacity:.35;box-shadow:inset 0 0 0 2px var(--mint);background:var(--mint-2);cursor:default}
.pc.shake{animation:shake .35s;box-shadow:inset 0 0 0 2.5px var(--red),0 3px 0 var(--red)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

.footer{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:2px solid var(--line);padding-block:14px calc(14px + env(safe-area-inset-bottom,0px))}
.footer.ok{background:var(--mint-2);border-color:var(--mint-2)}
.footer.bad{background:var(--red-2);border-color:var(--red-2)}
.footer-in{position:relative;max-width:760px;margin:0 auto;padding-inline:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.orange-pop{position:absolute;right:16px;top:-4px;display:flex;align-items:center;gap:4px;font-family:var(--f-disp);font-weight:800;font-size:15px;color:#E4783C;pointer-events:none;animation:orangeFloat 1.1s ease-out forwards}
.orange-pop svg{width:18px;height:18px}
@keyframes orangeFloat{0%{opacity:0;transform:translateY(6px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translateY(-22px) scale(1)}}
.fb{flex:1;min-width:220px;display:grid;gap:4px}
.fb h3{font-size:21px}
.footer.ok .fb h3{color:var(--mint-t)}
.footer.bad .fb h3{color:var(--red-t)}
.fb .zb .z{font-size:16px}
.fb .why{margin:0;font-size:13.5px;color:var(--ink-2);max-width:62ch}
.fb-scroll{max-height:34vh;overflow:auto}

/* end screens */
.end{padding:28px 24px;display:grid;gap:16px;justify-items:center;text-align:center;margin-top:10px}
.end .big{font-family:var(--f-logo);font-size:clamp(44px,10vw,68px);line-height:1;color:var(--coral)}
.end h2{font-size:24px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%}
.stat{border-radius:var(--r-md);padding:12px;box-shadow:inset 0 0 0 2px var(--line)}
.stat b{display:block;font-family:var(--f-disp);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:800;color:var(--ink-3)}
.stat.s1 b{color:var(--amber)} .stat.s2 b{color:var(--mint)} .stat.s3 b{color:var(--ice)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* duel */
.duel{display:grid;gap:12px;margin-top:6px;padding-bottom:150px}
.stage{position:relative;height:clamp(300px,44vh,380px);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);background:#F5E6C0}
.stage .bg{position:absolute;inset:0;width:100%;height:100%}
.stage .por{position:absolute;right:2%;bottom:0;height:88%;aspect-ratio:200/240;max-width:46%}
.stage .por svg{width:100%;height:100%;display:block}
.talking .mouth{animation:talk .16s steps(2) infinite}
@keyframes talk{50%{transform:scaleY(.3)}}
.talk{position:absolute;left:14px;top:14px;bottom:14px;width:min(56%,440px);display:flex;flex-direction:column;justify-content:space-between;gap:10px;overflow-y:auto;z-index:2}
.bubble{position:relative;background:var(--card);border-radius:20px;padding:12px 16px;box-shadow:var(--shadow)}
.bubble .who{font-size:11px;font-weight:800;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.bubble .z{font-size:17px}
.bubble.me{background:var(--coral-2);align-self:flex-start}
.meter{position:absolute;top:12px;right:12px;background:var(--panel);border-radius:var(--r-md);padding:8px 12px;width:210px;box-shadow:var(--shadow);z-index:3}
.meter .nm{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:800;color:var(--ink-2)}
.meter .nm b{font-family:var(--f-disp);font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.mtrack{position:relative;height:12px;border-radius:99px;background:var(--panel-2);box-shadow:inset 0 0 0 1.5px var(--line);margin-top:5px}
.mtrack i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sun),var(--mint));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.mtrack .goal{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--ink)}
.meter .deal{margin-top:6px;font-size:12px;font-weight:800;color:var(--ink-2);display:flex;justify-content:space-between}
.meter .deal b{font-family:var(--f-disp);font-size:14px;color:var(--ink)}
.turnpips{display:flex;gap:4px;margin-top:6px}
.turnpips i{width:16px;height:5px;border-radius:9px;background:var(--line)}
.turnpips i.on{background:var(--ink)}
.intro-card{position:absolute;inset:0;display:grid;place-items:center;background:rgba(245,230,192,.55);backdrop-filter:blur(2px);padding:16px;z-index:4}
.intro-card .panel{max-width:470px;padding:20px 22px;display:grid;gap:10px}
.intro-card h2{font-size:24px}
.intro-card p{margin:0}
.whisper{display:flex;gap:10px;align-items:center;background:var(--sun-2);border-radius:var(--r-md);padding:10px 12px}
.verdict{display:inline-block;font-family:var(--f-zh);font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px}
.v-best{background:var(--mint-2);color:var(--mint-t)} .v-partial{background:var(--amber-2);color:var(--amber-t)} .v-miss{background:var(--violet-2);color:var(--violet-t)} .v-costly{background:var(--red-2);color:var(--red-t)}
.better{border-radius:var(--r-sm);background:var(--card);padding:8px 10px;margin-top:4px}
.better .lbl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mint-t)}
.replay{width:100%;text-align:left;display:grid;gap:12px}
.replay .item{padding:12px 14px;border-radius:var(--r-md);background:var(--panel-2);display:grid;gap:6px}

/* word bank + sheet */
.bank-h{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.bank-h h1{font-size:30px}
.bank-h h1 .zh{font-family:var(--f-logo);font-weight:400;color:var(--coral);margin-right:8px}
.search{width:100%;font:inherit;font-size:16px;font-weight:700;padding:12px 16px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--card);color:var(--ink)}
.search:focus{border-color:var(--ice);outline:none}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.wc{position:relative;border:0;text-align:left;background:var(--card);border-radius:var(--r-md);padding:12px 14px;box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line);display:grid;gap:1px}
.wc:hover{box-shadow:inset 0 0 0 2px var(--ice),0 3px 0 var(--ice)}
.wc b{font-family:var(--f-zh);font-size:20px;font-weight:700;line-height:1.3}
.wc i{font-style:normal;color:var(--coral);font-weight:800;font-size:13px}
.wc span{font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wc .badges{position:absolute;top:10px;right:10px;display:flex;gap:4px}
.badge{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:1px 7px}
.badge.key{background:var(--sun-2);color:var(--sun-t)}
.badge.cold{background:var(--ice-2);color:var(--ice)}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.sec-h h2{font-size:20px}
.sec-h .zh{color:var(--ink-3);font-weight:700}
#sheet{position:fixed;inset:0;z-index:40;display:grid;place-items:end center;background:rgba(10,15,25,.45)}
#sheet[hidden]{display:none!important}
.sheet{width:min(100%,640px);max-height:86vh;overflow:auto;background:var(--panel);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px -10px rgba(0,0,0,.4);padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:700px){ #sheet{place-items:center} .sheet{border-radius:24px} }
.sheet-top{display:flex;gap:10px;align-items:center}
.sheet-top .sp{flex:1}
.sheet .head{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.sheet .head .zb .z{font-size:40px;font-weight:700}
.sheet .head .mean{font-family:var(--f-disp);font-size:20px;font-weight:700;color:var(--ink-2)}
.sheet .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.uses{display:grid;gap:10px}
.use{padding:12px 14px;border-radius:var(--r-md);background:var(--panel-2)}
.use .zb .z{font-size:17px}
.use .zb .e{display:block}
.use .src{font-size:11px;font-weight:800;letter-spacing:.05em;color:var(--ink-3);margin-top:4px;font-family:var(--f-zh)}
.use mark{background:var(--sun-2);color:inherit;border-radius:4px}
.tipmore{font-size:11px!important;color:var(--sun)!important;font-weight:800;margin-top:2px}
/* pop quiz */
.pop{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:var(--r-md);background:var(--violet-2);color:var(--violet-t);font-weight:800}
.pop svg{width:26px;height:26px;flex:none;color:var(--sun)}
.pop .sub{display:block;font-size:12.5px;font-weight:700;opacity:.85}
.ptimer{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line)}
.ptimer i{display:block;height:100%;width:100%;background:var(--violet);border-radius:99px;animation:drain var(--dur,12s) linear forwards}
@keyframes drain{to{width:0}}
.recall-q .z{font-size:40px!important;font-weight:700}
.recall-q .en-big{font-size:24px}

@media (max-width:640px){
  .stage{height:auto;min-height:430px}
  .talk{position:relative;left:auto;top:auto;bottom:auto;width:auto;padding:12px 12px 210px;justify-content:flex-start;overflow:visible}
  .stage .por{max-width:56%;height:230px}
  .meter{top:auto;bottom:12px;right:auto;left:12px;width:calc(46% - 12px)}
  .hud-mid .hearts .lbl{display:none}
  .hud-mid{order:3;flex-basis:100%}
  .hud-mid:empty{display:none}
  .intro-word .zb .z{font-size:30px}
}
.gj-list{display:grid;gap:10px}
.gj-card{display:flex;gap:12px;align-items:center;padding:10px;border-radius:var(--r-md);background:var(--panel);box-shadow:var(--shadow)}
.gj-card .gj-thumb{width:96px;flex:none;border-radius:10px;overflow:hidden}
.gj-card.locked{opacity:.5}
.gj-card.locked .gj-thumb svg,.gj-locked-thumb svg{filter:grayscale(1)}
.gj-card.next{box-shadow:0 0 0 2px var(--sun),var(--shadow)}
.gj-txt{display:grid;gap:2px;min-width:0}
#gscene.bounce svg{animation:gbounce .5s ease}
@keyframes gbounce{0%{transform:scale(1)}30%{transform:scale(1.04) translateY(-4px)}60%{transform:scale(.98)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>

<script>
(function(){
'use strict';
const D = DATA;

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOUCH = window.matchMedia && matchMedia('(hover: none)').matches;
let S = { py:false, en:false, sound:true, theme:'auto' };
const HOST_THEME = document.documentElement.getAttribute('data-theme');
try { Object.assign(S, JSON.parse(localStorage.getItem('cjxt-settings')||'{}')); } catch(e){}
function saveS(){ try{ localStorage.setItem('cjxt-settings', JSON.stringify(S)); }catch(e){} applyS(); }
function applyS(){ const de=document.documentElement; if(S.theme==='auto'){ if(HOST_THEME) de.setAttribute('data-theme',HOST_THEME); else de.removeAttribute('data-theme'); } else de.setAttribute('data-theme',S.theme);
  const r=document.getElementById('root'); r.classList.toggle('show-py',!!S.py); r.classList.toggle('show-en',!!S.en); }

/* ---------- audio ---------- */
let AC=null, MG=null;
function ac(){ if(!S.sound) return null; try{ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); MG=AC.createGain(); MG.gain.value=.55; MG.connect(AC.destination);} if(AC.state==='suspended') AC.resume(); }catch(e){ return null; } return AC; }
function tone(freqs, {type='sine', dur=.12, gap=.08, vol=.18, at=0, slide=null}={}){
  const a=ac(); if(!a) return;
  freqs.forEach((f,i)=>{ const t=a.currentTime+at+i*gap; const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g); g.connect(MG); o.start(t); o.stop(t+dur+.02); });
}
function noise(dur=.15, vol=.15){ const a=ac(); if(!a) return; const b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length); const s=a.createBufferSource(), g=a.createGain(), f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; s.buffer=b; g.gain.value=vol; s.connect(f); f.connect(g); g.connect(MG); s.start(); }
const SFX = {
  click:()=>tone([1250],{dur:.04,vol:.07}),
  fit:()=>tone([660,990],{type:'triangle',gap:.07,dur:.14}),
  super:()=>tone([660,880,1175,1568],{type:'triangle',gap:.06,dur:.16}),
  generic:()=>tone([392],{type:'triangle',dur:.16,vol:.12}),
  cave:()=>{ tone([1320,1760],{gap:.05,dur:.1,vol:.1}); tone([520],{type:'triangle',at:.15,dur:.25,slide:300,vol:.12}); },
  off:()=>tone([330],{type:'sawtooth',dur:.35,slide:150,vol:.08}),
  blunt:()=>{ noise(.18,.22); tone([110,98],{type:'square',gap:.1,dur:.2,vol:.07}); },
  ding:()=>tone([1318,1760],{gap:.09,dur:.12,vol:.1}),
  win:()=>tone([523,659,784,1047],{type:'triangle',gap:.1,dur:.25}),
  lose:()=>tone([392,330,262],{type:'triangle',gap:.16,dur:.3}),
  tok:()=>tone([880],{dur:.06,vol:.1}),
  bad:()=>tone([160],{type:'square',dur:.14,vol:.06})
};
function sfx(n){ try{ SFX[n]&&SFX[n](); }catch(e){} }
function blip(tn, v){
  const a=ac(); if(!a||!tn) return;
  const t=a.currentTime, dur=.075/v.speed, f0=v.base*(.96+Math.random()*.08);
  const o=a.createOscillator(), g=a.createGain(), f=a.createBiquadFilter();
  o.type='triangle'; f.type='lowpass'; f.frequency.value=1900;
  const F=o.frequency;
  if(tn==1){ F.setValueAtTime(f0*1.25,t); }
  else if(tn==2){ F.setValueAtTime(f0*.95,t); F.linearRampToValueAtTime(f0*1.3,t+dur); }
  else if(tn==3){ F.setValueAtTime(f0*.9,t); F.linearRampToValueAtTime(f0*.74,t+dur*.55); F.linearRampToValueAtTime(f0*.95,t+dur); }
  else if(tn==4){ F.setValueAtTime(f0*1.38,t); F.linearRampToValueAtTime(f0*.8,t+dur); }
  else { F.setValueAtTime(f0,t); }
  if(v.wobble){ const l=a.createOscillator(), lg=a.createGain(); l.frequency.value=16; lg.gain.value=v.wobble; l.connect(lg); lg.connect(F); l.start(t); l.stop(t+dur+.03); }
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.16,t+.008); g.gain.setValueAtTime(.16,t+dur*.6); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(f); f.connect(g); g.connect(MG); o.start(t); o.stop(t+dur+.03);
}

/* ---------- typewriter ---------- */
let TW=null;
function typeInto(el, line, charKey, done){
  if(TW){ clearTimeout(TW.t); TW=null; }
  const tn=line.tn||'', v=(D.chars[charKey]||D.chars.me).voice;
  if(RM||!line.w){ el.innerHTML=words(line); done&&done(); return; }
  el.innerHTML=words(line,true); el.classList.add('cursor');
  const toks=[...el.children], lens=line.w.map(t=>[...t[0]].length);
  let ti=0, k=0, ci=0;
  const fin=()=>{ if(TW) clearTimeout(TW.t); toks.forEach(t=>t.classList.remove('hid')); el.classList.remove('cursor'); TW=null; done&&done(); };
  const step=()=>{
    if(ti>=toks.length){ fin(); return; }
    if(k===0) toks[ti].classList.remove('hid');
    const ch=[...line.w[ti][0]][k]||'', tone=+tn[ci]||0; if(tone) blip(tone,v);
    ci++; k++; if(k>=lens[ti]){ ti++; k=0; }
    TW={t:setTimeout(step, /[，。？！：…]/.test(ch)?190:(tone?74/v.speed:25)), finish:fin};
  };
  step();
}
function skipType(){ if(TW&&TW.finish) TW.finish(); }

  huang: {skin:'#F5CFB2',skinS:'#DFAC89',hair:'#3A2320',hairS:'#231312',style:'perm',top:'#E0508F',topS:'#BF3874',shirt:'#FFE9F2',pearls:true,glasses:'#C2303A',blush:.35},

function portrait(key, mood='neutral'){

/* ---------- session ---------- */
let X=null; // current lesson / review / duel
let screen='home';
const HEAD = {
  intro:['新词','New phrase'], meaning:['什么意思？','What does this mean?'], blank:['填空','Fill in the blank'], build:['组句','Build the sentence'],
  type:['用拼音打出来','Type it in pinyin'], tone:['换个说法','Fix the tone'], concern:['她真正担心什么？','What is her real concern?'],
  math:['算一算','Do the maths'], pairs:['配对','Match the pairs'], recall:['还记得吗？','Remember this one?']

const POP_P = /[?&]pop/.test(location.search)?1:0.12, POP_SECS=12; let popTimer=null;
function recallEx(zh, pop){
  const W=WORDS.get(zh), mode=Math.random()<.5?'zh':'en';
  const pool=shuffle(seenWords().filter(w=>w.zh!==zh&&w.d!==W.d)); const fill=shuffle([...WORDS.values()].filter(w=>meaningful(w)&&w.zh!==zh&&w.d!==W.d&&!pool.includes(w)));
  const others=[...pool,...fill].slice(0,3);
  const opts=[W,...others].map(w=>mode==='zh'?{txt:w.d}:{zh:w.zh,w:[[w.zh,w.py,w.d]]});
  return { t:'recall', zh, pop:!!pop, mode, word:{zh:W.zh,w:[[W.zh,W.py,W.d]],py:W.py,en:W.d}, opts };
}
function maybePop(){
  if(X.mode!=='lesson'||X.popDone||X.graded<3||X.hearts<=0) return;
  const pool=X.pastWords.filter(z=>WORDS.has(z)); if(pool.length<4) return;
  if(Math.random()>=POP_P) return;
  X.popDone=true; const zh=pool[Math.floor(Math.random()*pool.length)];
  X.queue.splice(X.pos+1,0,{syn:recallEx(zh,true), pop:true});
}
function startLesson(lid){
  const L=lessonOf(lid);
  const here=new Set(); L.ex.forEach(e=>markSeenInto(e,here));
  const pastWords=seenWords().map(w=>w.zh).filter(z=>!here.has(z));
  X={ mode:'lesson', lid, title:L, pastWords, popDone:false, queue:L.ex.map((e,i)=>({lid,i})), pos:0, hearts:5, graded:0, correct:0, requeued:{}, newLeads:0, xp:0, oranges:0, phase:'answer', sel:null, res:null, ui:null };
  screen='lesson'; initEx(); render();
}
function startReview(){
  const ids=shuffle(Object.keys(P.leads).filter(id=>{ if(id.startsWith('w:')) return WORDS.has(id.slice(2)); const [lid,i]=id.split('-'); const L=lessonOf(lid); return L&&L.ex[+i]; })).slice(0,8);
  const queue=ids.map(id=>{ if(id.startsWith('w:')) return {syn:recallEx(id.slice(2),false)}; const [lid,i]=id.split('-'); return {lid,i:+i}; });
  X={ mode:'review', queue, pos:0, hearts:Infinity, graded:0, correct:0, requeued:{}, revived:0, xp:0, oranges:0, phase:'answer', sel:null, res:null, ui:null };
  screen='lesson'; initEx(); render();
}
function cur(){ return exOf(X.queue[X.pos]); }
function CC(){ const r=X.queue[X.pos]; return UNITS[lessonOf(r.lid).u].concerns; }
function initEx(){
  const e=cur(); X.phase='answer'; X.sel=null; X.res=null; X.ui={}; if(!e.pop) markSeen(e);
  clearTimeout(popTimer);
  if(e.t==='recall'){ X.ui.order=shuffle([0,1,2,3]); if(e.pop){ X.ui.t0=Date.now(); popTimer=setTimeout(()=>{ if(X&&cur()===e&&X.phase==='answer'){ X.ui.timeout=true; grade(false); } }, POP_SECS*1000); } }
  if(['meaning','blank','math','tone','concern'].includes(e.t)){
    let n= e.t==='meaning'?[e.ans,...e.opts].length : e.t==='concern'?5 : e.opts.length;
    X.ui.order = e.t==='concern' ? Object.keys(CC()) : shuffle([...Array(n).keys()]);
  }
  if(e.t==='build'){ X.ui.bank=shuffle([...e.tiles.map((t,i)=>'t'+i), ...e.extra.map((t,i)=>'x'+i)]); X.ui.ans=[]; }
  if(e.t==='pairs'){ X.ui.L=shuffle([0,1,2,3]); X.ui.R=shuffle([0,1,2,3]); X.ui.done=[]; X.ui.pl=null; X.ui.pr=null; X.ui.missed=false; }
  if(e.t==='type'){ X.ui.val=''; X.ui.hint=false; }
}
function tileObj(e,k){ return k[0]==='t'?e.tiles[+k.slice(1)]:e.extra[+k.slice(1)]; }
function canCheck(){ const e=cur(); if(X.phase!=='answer') return false;
  if(e.t==='build') return X.ui.ans.length>0; if(e.t==='type') return X.ui.val.trim().length>0; if(e.t==='pairs'||e.t==='intro') return false; return X.sel!=null; }
const normPy = s => s.toLowerCase().replace(/ü/g,'v').replace(/u:/g,'v').replace(/[^a-z]/g,'');

function check(){
  const e=cur(); let ok=false, picked=null;
  switch(e.t){
    case 'meaning': { const opts=[e.ans,...e.opts]; ok = X.sel===0; picked=opts[X.sel]; break; }
    case 'blank': case 'math': ok = e.opts[X.sel].zh===e.ans; break;
    case 'tone': ok = !!e.opts[X.sel].ok; break;
    case 'concern': ok = X.sel===e.ans; break;
    case 'recall': ok = X.sel===0; break;
    case 'build': ok = X.ui.ans.map(k=>tileObj(e,k).zh).join('')===e.ansZh; break;
    case 'type': ok = normPy(X.ui.val)===e.syl.join('').replace(/ü/g,'v'); break;
  }
  grade(ok);
}
function grade(ok){
  const ref=X.queue[X.pos], id=idOf(ref); clearTimeout(popTimer);
  X.orangeAnim=false;
  if(ref.pop){ X.res={ok,pop:true}; X.phase='feedback';
    if(ok){ X.xp+=5; X.popBonus=(X.hearts<5); if(X.hearts<5) X.hearts++; earnOranges(2); X.orangeAnim=2; sfx('super'); }
    else { P.leads[id]={n:((P.leads[id]||{}).n||0)+1}; X.newLeads++; sfx('off'); }
    save(); render(); return; }
  X.graded++; X.res={ok}; X.phase='feedback';
  if(ok){ X.correct++; X.xp+=2; earnOranges(1); X.orangeAnim=1; sfx('fit'); if(X.mode==='review'&&P.leads[id]){ delete P.leads[id]; X.revived++; } }

    sfx('off');
    if(X.mode==='lesson'){ X.hearts--; if(!P.leads[id]) X.newLeads++; P.leads[id]={n:((P.leads[id]||{}).n||0)+1}; if(!X.requeued[id]&&cur().t!=='pairs'){ X.requeued[id]=1; X.queue.push(X.queue[X.pos]); } }
    else { P.leads[id]={n:((P.leads[id]||{}).n||0)+1}; }
  }
  save(); render();
}
function next(){
  if(X.phase==='feedback'&&!X.queue[X.pos].pop) maybePop();
  if(X.mode==='lesson'&&X.hearts<=0){ X.end='fail'; screen='end'; render(); sfx('lose'); return; }
  X.pos++;
  if(X.pos>=X.queue.length){ finish(); return; }
  initEx(); render();
}
function finish(){
  if(X.mode==='lesson'){ X.xp+=10; P.done[X.lid]=true; earnOranges(5); }
  P.xp+=X.xp; save(); X.end='done'; screen='end'; sfx('win'); render();
}

function onType(ev){ X.ui.val=ev.target.value; paintType(); const b=$('[data-act="check"]'); if(b) b.disabled=!canCheck(); }
function paintType(){
  const e=cur(), v=normPy(X.ui.val); const syl=e.syl.map(s=>s.replace(/ü/g,'v'));
  let acc='', hits=0; for(const s of syl){ if(v.startsWith(acc+s)){ acc+=s; hits++; } else break; }

  let k=0; document.querySelectorAll('.typebox .target ruby.w').forEach(w=>{ const n=[...w.dataset.t].length; w.classList.toggle('hit', k+n<=hits); k+=n; });

  if(X.mode==='lesson'&&X.end==='fail'){
    html=`<div class="big">已读不回</div><h2>You ran out of trust</h2><p class="muted" style="margin:0;max-width:44ch">The client stopped replying. Everything you missed is now in your cold leads. Try the lesson again.</p>
      ${X.oranges?`<p class="hint" style="margin:0">You still keep the ${X.oranges} 桔子 you picked.</p>`:''}
      <div class="actions"><button class="btn" data-act="lesson" data-id="${X.lid}">再试一次 Try again</button><button class="btn ghost" data-act="home">Home</button></div>`;
  } else if(X.mode==='lesson'){
    const acc=X.graded?Math.round(X.correct/X.graded*100):100;
    html=`<div class="big">课程完成</div><h2>${esc(X.title.en)} · <span class="zh">${X.title.zh}</span></h2>
      <div class="tiles"><div class="stat s1"><b>+${X.xp}</b><span>XP to quota</span></div><div class="stat s2"><b>${acc}%</b><span>Accuracy</span></div><div class="stat s3"><b>${X.newLeads}</b><span>New cold leads</span></div>${orangeTile(X.oranges)}</div>
      ${newStageBlock(P.oranges)}
      <div class="actions"><button class="btn" data-act="home">继续 Continue</button></div>`;
  } else {
    html=`<div class="big">线索回暖</div><h2>Revived ${X.revived} of ${X.queue.length} leads</h2>
      <div class="tiles"><div class="stat s1"><b>+${X.xp}</b><span>XP to quota</span></div><div class="stat s3"><b>${leadCount()}</b><span>Cold leads left</span></div>${orangeTile(X.oranges)}</div>
      ${newStageBlock(P.oranges)}
      <div class="actions"><button class="btn" data-act="home">继续 Continue</button>${leadCount()?'<button class="btn ghost" data-act="review">Another round</button>':''}</div>`;
  }
  $('#screen').innerHTML=`<section class="panel end">${html}</section>`;
}

/* ---------- duel ---------- */
const DV={ best:{zh:'最佳',en:'Best answer',d:15}, partial:{zh:'还行',en:'Partly there',d:7}, miss:{zh:'没抓住重点',en:'Missed the concern',d:-5}, costly:{zh:'代价太高',en:'Too costly',d:10} };
const kOf = o => o.kBy ? o.kBy[X.prio] : o.k;
function startDuel(u){ const du=UNITS[u].duel; const pk=du.priorities?Object.keys(du.priorities):null;
  X={ mode:'duel', u, turn:0, chance:du.start, deal:du.deal||150000, phase:'intro', sel:null, order:null, last:null, log:[], costlyAt:-1, mood:'neutral', oranges:0, prio: pk?pk[Math.floor(Math.random()*pk.length)]:null }; screen='duel'; render(); }
function dLine(t){ const T=UNITS[X.u].duel.turns[t]; if(T.lineBy) return T.lineBy[X.prio]; return (T.alt&&X.costlyAt>=0&&X.costlyAt<t)?T.alt:T.line; }
function rDuel(){
  const du=UNITS[X.u].duel, T=du.turns[X.turn]||du.turns[du.turns.length-1], ch=D.chars[du.char];
  const pips=du.turns.map((_,i)=>`<i class="${i<=X.turn&&X.phase!=='intro'?'on':''}"></i>`).join('');
  let talk='', meB='';
  if(X.phase==='end'){ const win=X.chance>=du.goal; talk=`<div class="bubble"><div class="who">${ch.name}</div>${zb(win?du.win:du.lose)}</div>`; }
  else if(X.phase!=='intro'){
    const line=dLine(X.turn), anim=X.phase==='line';
    talk=`<div class="bubble"><div class="who">${ch.name}</div>${anim?`<div class="zb" data-reveal><span class="z" id="tw"></span>${line.en?`<span class="e">${esc(line.en)}</span>`:''}</div>`:zb(line)}</div>`;
    if(X.phase==='said'||X.phase==='result'){ const o=T.options[X.last.idx]; meB=`<div class="bubble me"><div class="who">You</div>${X.phase==='said'?`<div class="zb"><span class="z" id="tw"></span></div>`:zb(o)}</div>`; }
  }
  const mood=X.phase==='end'?(X.chance>=du.goal?'happy':'angry'):X.phase==='result'?X.mood:'neutral';
  const stage=`<div class="stage" id="stage">${sceneSVG(du.scene)}<div class="por" id="por">${portrait(du.char,mood)}</div>
    <div class="meter"><div class="nm"><span><span class="zh">成交概率</span> Close chance</span><b>${X.chance}%</b></div><div class="mtrack"><i style="width:${X.chance}%"></i><span class="goal" style="left:${du.goal}%" title="Needed: ${du.goal}%"></span></div>
      <div class="deal"><span>Deal value</span><b>${money(X.deal)}</b></div>${du.priorities?`<div class="deal"><span>Her priority</span><b class="zh">${X.phase==='end'?du.priorities[X.prio].zh:'？'}</b></div>`:''}<div class="turnpips">${pips}</div></div>
    ${talk||meB?`<div class="talk">${talk}${meB}</div>`:''}
    ${X.phase==='intro'?`<div class="intro-card"><div class="panel"><div class="eyebrow">Unit ${UNITS[X.u].unit.n} test · ${du.turns.length} turns · reach ${du.goal}%</div><h2><span class="zh">${du.title.zh}</span> ${esc(du.title.en)}</h2><p>${esc(du.intro)}</p>
      ${du.whisper?`<div class="whisper">${zb(du.whisper)}</div>`:''}<p class="hint">${du.priorities?'Her priority is hidden and changes every time. Listen for it.':'Every answer sounds reasonable. Pick the one that answers what was actually asked.'}</p><div><button class="btn" data-act="duel-go"><span class="zh">开始</span> Start</button></div></div></div>`:''}
  </div>`;
  let opts='';
  if(X.phase==='choose') opts=`<div class="choices">${X.order.map((i,n)=>{ const o=T.options[i]; return `<button class="ch ${X.sel===i?'sel':''}" data-act="dopt" data-v="${i}"><span class="k">${n+1}</span>${zb(o)}</button>`; }).join('')}</div>`;
  if(X.phase==='line'||X.phase==='said') opts=`<div class="panel" style="padding:16px;text-align:center" ><span class="hint">${X.phase==='line'?ch.name+' is talking… tap the scene to skip':'…'}</span></div>`;
  $('#screen').innerHTML=`<section class="duel">${stage}${opts}</section>`;
  let f='';
  if(X.phase==='choose') f=`<div class="footer"><div class="footer-in"><div class="fb"><span class="hint">${TOUCH?'Tap a reply, then say it':'Keys 1–4 · hover words for meaning'}</span></div><button class="btn" data-act="dsay" ${X.sel==null?'disabled':''}>说 Say it</button></div></div>`;
  if(X.phase==='result'){ const L=X.last, o=T.options[L.idx], k=kOf(o), v=DV[k], best=T.options.find(x=>kOf(x)==='best'), good=k==='best';
    f=`<div class="footer ${good?'ok':k==='partial'?'':'bad'}"><div class="footer-in"><div class="fb fb-scroll"><div><span class="verdict v-${k}">${v.zh} · ${v.en}</span> <b style="font-family:var(--f-disp)">${v.d>0?'+':''}${v.d}%</b>${k==='costly'?' <b style="font-family:var(--f-disp);color:var(--red-t)">Deal −10%</b>':''}</div>
      <p class="why">${esc(o.why)}${o.kBy&&!good?' It doesn\'t match what she said matters most.':''}</p>${good?'':`<div class="better"><div class="lbl">Best answer</div>${zb(best,'open')}</div>`}</div><button class="btn ${good?'ok':'bad'}" data-act="dnext">继续 Continue</button></div></div>`; }
  if(X.phase==='end'){ const win=X.chance>=du.goal, promo=X.promo;
    const miss=X.log.filter(l=>l.k!=='best').map(l=>{ const T2=du.turns[l.t]; const o=T2.options[l.idx], best=T2.options.find(x=>(x.kBy?x.kBy[X.prio]:x.k)==='best');
      return `<div class="item"><div>${zb(l.line)}</div><div><span class="verdict v-${l.k}">${DV[l.k].zh}</span> ${zb(o)}</div><div class="better"><div class="lbl">Best answer</div>${zb(best,'open')}</div></div>`; }).join('');
    const last = X.u===UNITS.length-1;
    $('#screen').innerHTML+=`<section class="panel end" style="margin-top:12px"><div class="big">${win?(last?'全部成交':'签约成功'):'单子丢了'}</div>
      <h2>${win?`${esc(du.title.en)}: passed at ${money(X.deal)}`:`Close chance ${X.chance}%, needed ${du.goal}%`}</h2>
      ${du.priorities?`<p style="margin:0">Her real priority this time: <b class="zh">${du.priorities[X.prio].zh}</b> ${esc(du.priorities[X.prio].en)}</p>`:''}
      ${promo?`<p style="margin:0;font-weight:800">Promoted: <span class="zh">${RANKS[promo].zh}</span> ${RANKS[promo].en}</p>`:''}
      ${X.oranges?`<div class="tiles" style="max-width:220px;margin:0 auto">${orangeTile(X.oranges)}</div>`:''}
      ${newStageBlock(P.oranges)}
      ${win&&last?`<p style="margin:0;max-width:52ch">That's the whole course: from first call to a stamped contract. Keep your cold leads warm, and replay any lesson or negotiation to stay sharp.</p>`:''}
      ${miss?`<div class="replay"><h3 style="font-size:18px">复盘 · Replay</h3>${miss}</div>`:'<p class="muted" style="margin:0">Every answer was the best one.</p>'}
      <div class="actions">${win?'':`<button class="btn" data-act="duel" data-u="${X.u}">再谈一次 Try again</button>`}<button class="btn ${win?'':'ghost'}" data-act="home">${win?'继续 Continue':'Home'}</button></div></section>`;
  }
  $('#footer').innerHTML=f;
  const tw=$('#tw'), talkOn=on=>{ const p=$('#por'); p&&p.classList.toggle('talking',on); };
  if(X.phase==='line') markSeen(dLine(X.turn)); if(X.phase==='choose'&&!X.seenOpts){ X.seenOpts=X.turn+1; markSeen(T.options); }
  if(X.phase==='line'&&tw){ talkOn(true); typeInto(tw, dLine(X.turn), du.char, ()=>{ talkOn(false); if(X&&X.phase==='line'){ X.phase='choose'; X.order=shuffle([...T.options.keys()]); X.sel=null; render(); } }); }
  if(X.phase==='said'&&tw) typeInto(tw, T.options[X.last.idx], 'me', ()=>{ if(X&&X.phase==='said'){ X.phase='result'; const k=kOf(T.options[X.last.idx]); sfx(k==='best'?'fit':k==='partial'?'generic':k==='costly'?'cave':'off'); render(); } });
  if(X.phase==='end'&&!X.endSfx){ X.endSfx=true; sfx(X.chance>=du.goal?'win':'lose'); }
}
function dSay(){
  const T=UNITS[X.u].duel.turns[X.turn], o=T.options[X.sel], k=kOf(o), v=DV[k];
  X.chance=Math.max(0,Math.min(100,X.chance+v.d)); if(k==='costly'){ X.deal=Math.round(X.deal*.9); if(X.costlyAt<0) X.costlyAt=X.turn; }
  X.mood={best:'happy',partial:'neutral',miss:'confused',costly:'happy'}[k];
  if(k==='best') earnOranges(3); else if(k==='partial') earnOranges(1);
  X.log.push({t:X.turn, idx:X.sel, k, line:dLine(X.turn)}); X.last={idx:X.sel}; X.phase='said'; sfx('click'); render();
}
function dNext(){ X.seenOpts=0; save();
  const du=UNITS[X.u].duel;
  if(X.turn>=du.turns.length-1){ X.phase='end'; const win=X.chance>=du.goal;
    if(win){ const id=UNITS[X.u].id, first=!P.deals[id]; P.deals[id]=Math.max(P.deals[id]||0,X.deal); const r=PROMO[id]; if(r&&P.rank<r){ P.rank=r; X.promo=r; } if(first){ P.xp+=50; earnOranges(10); } save(); }
    render(); window.scrollTo(0,0); return; }
  X.turn++; X.phase='line'; X.sel=null; render();
}

/* ---------- input ---------- */
document.addEventListener('click', ev=>{
  const word=ev.target.closest('ruby.w');
  if(ev.target.id==='sheet'){ closeSheet(); return; }
  if(word&&!word.closest('button')&&!word.closest('.typebox')){
    if(!TOUCH||tipFor===word){ if(!word.closest('#sheet')) sheetStack=[]; openSheet(word.dataset.t); return; }
    showTip(word); return;
  }
  if(TOUCH){ if(word){ if(tipFor===word) hideTip(); else showTip(word); } else hideTip(); }
  const a=ev.target.closest('[data-act]');
  if(!a){ if(ev.target.closest('#stage')&&typeof TW!=='undefined'&&TW) skipType(); return; }
  const act=a.dataset.act; ac();
  switch(act){
    case 'tg-py': S.py=!S.py; saveS(); renderHUD(); break;
    case 'tg-en': S.en=!S.en; saveS(); renderHUD(); break;
    case 'tg-snd': S.sound=!S.sound; saveS(); renderHUD(); break;
    case 'unit-toggle': { const u=+a.dataset.u; if(expanded.has(u)) expanded.delete(u); else expanded.add(u); if(u===currentUnit()&&!P.deals[UNITS[u].id]){ /* current unit always open */ } rHome(); break; }
    case 'lp-create': createFile(); break;
    case 'lp-open': openFile(); break;
    case 'lp-reconnect': reconnect(); break;
    case 'lp-export': exportFile(); break;
    case 'lp-import': { const inp=$('#lpimp'); if(inp){ inp.onchange=()=>{ if(inp.files[0]) importFile(inp.files[0]); }; inp.click(); } break; }
    case 'do-backup': shareBackup(); break;
    case 'do-link': shareLink(); break;
    case 'restore-replace': restoreReplace(); break;
    case 'restore-merge': restoreMerge(); break;
    case 'restore-cancel': restoreCancel(); break;
    case 'backup-nudge-dismiss': backupNudgeDismissed=true; rHome(); break;
    case 'sync-connect': { const inp=$('#synctok'); const tok=inp?inp.value.trim():''; if(inp) inp.value=''; if(tok) syncConnect(tok); break; }
    case 'sync-now': syncPull(true); break;
    case 'sync-disconnect': syncDisconnectConfirm=true; rHome(); break;
    case 'sync-disconnect-cancel': syncDisconnectConfirm=false; rHome(); break;
    case 'sync-disconnect-yes': clearSyncCreds(); syncDisconnectConfirm=false; rHome(); break;
    case 'bank': X={q:''}; screen='bank'; render(); window.scrollTo(0,0); break;
    case 'garden': screen='garden'; render(); window.scrollTo(0,0); break;
    case 'gbounce': { const el=$('#gscene'); if(el&&!RM){ el.classList.remove('bounce'); void el.offsetWidth; el.classList.add('bounce'); } break; }
    case 'word': openSheet(a.dataset.zh); break;
    case 'sheet-close': closeSheet(); break;
    case 'sheet-back': sheetStack.pop(); openSheet(sheetStack[sheetStack.length-1], false); break;
    case 'tg-theme': S.theme={auto:'dark',dark:'light',light:'auto'}[S.theme]||'auto'; saveS(); renderHUD(); break;
    case 'say': ev.stopPropagation(); say(a.dataset.say); break;
    case 'home': if(TW) skipType(); X=null; screen='home'; render(); window.scrollTo(0,0); break;
    case 'quit': if(TW) skipType(); X=null; screen='home'; render(); break;
    case 'lesson': sfx('click'); startLesson(a.dataset.id); window.scrollTo(0,0); break;
    case 'review': sfx('click'); startReview(); window.scrollTo(0,0); break;
    case 'duel': sfx('click'); startDuel(+a.dataset.u); window.scrollTo(0,0); break;
    case 'reset': $('#resetrow').innerHTML=`<span class="hint">Erase all progress and cold leads?</span><button class="link" data-act="reset-yes" style="color:var(--red-t)">Yes, reset</button><button class="link" data-act="home">Cancel</button>`; break;
    case 'reset-yes': P=freshP(); save(); render(); break;
    case 'got': sfx('click'); next(); break;
    case 'opt': if(X.phase!=='answer') break; { const e=cur(); const v=a.dataset.v; X.sel = e.t==='concern'?v:+v; sfx('tok'); rLesson(); renderHUD(); } break;
    case 'check': if(canCheck()) check(); break;
    case 'next': next(); break;
    case 'tile': if(X.phase==='answer'){ X.ui.ans.push(a.dataset.k); sfx('tok'); rLesson(); } break;
    case 'untile': if(X.phase==='answer'){ X.ui.ans.splice(+a.dataset.k,1); rLesson(); } break;
    case 'hint': X.ui.hint=true; rLesson(); break;
    case 'pl': case 'pr': pairTap(act, +a.dataset.i, a); break;
    case 'duel-go': X.phase='line'; render(); break;
    case 'dopt': if(X.phase==='choose'){ X.sel=+a.dataset.v; sfx('tok'); render(); } break;
    case 'dsay': if(X.phase==='choose'&&X.sel!=null) dSay(); break;
    case 'dnext': dNext(); break;
  }
});
function pairTap(side, i, el){
  const ui=X.ui, e=cur(); if(X.phase!=='answer') return;
  if(side==='pl') ui.pl=i; else ui.pr=i;
  if(ui.pl!=null&&ui.pr!=null){
    if(ui.pl===ui.pr){ ui.done.push(ui.pl); ui.pl=ui.pr=null; sfx('tok'); if(ui.done.length===4){ grade(!ui.missed); return; } }
    else { ui.missed=true; sfx('bad'); const l=ui.pl, r=ui.pr; ui.pl=ui.pr=null; rLesson();
      document.querySelectorAll(`[data-act="pl"][data-i="${l}"],[data-act="pr"][data-i="${r}"]`).forEach(b=>b.classList.add('shake')); return; }
  }
  rLesson();
}
document.addEventListener('keydown', ev=>{
  if(!$('#sheet').hidden){ if(ev.key==='Escape') closeSheet(); return; }
  if(ev.target.tagName==='INPUT') return;
  if(screen==='lesson'&&X){
    const e=cur();
    if(ev.key==='Enter'){ ev.preventDefault(); if(X.phase==='feedback') next(); else if(e.t==='intro') next(); else if(canCheck()) check(); return; }
    if(X.phase==='answer'&&/^[1-5]$/.test(ev.key)&&X.ui.order){ const v=X.ui.order[+ev.key-1]; if(v!=null){ X.sel=v; rLesson(); } }
  }
  if(screen==='duel'&&X){
    if(X.phase==='choose'&&/^[1-4]$/.test(ev.key)){ X.sel=X.order[+ev.key-1]; render(); }
    else if(ev.key==='Enter'){ ev.preventDefault(); if(X.phase==='choose'&&X.sel!=null) dSay(); else if(X.phase==='result') dNext(); else if(X.phase==='line'||X.phase==='said') skipType(); }
  }
});

/* ---------- boot ---------- */
function start(data){ if(data&&data.screen){ screen=data.screen; X=data.X; if(screen==='duel'&&X&&(X.phase==='line'||X.phase==='said')) X.phase=X.phase==='said'?'result':'choose'; if(screen==='duel'&&X&&X.phase==='choose'&&!X.order) X.order=[0,1,2,3]; } render(); }
try{ window.claude?.hot?.snapshot?.(()=>({screen, X})); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
if(LOCAL) bootLocal();
checkRestoreLink().then(()=>{ if(syncCreds && !pendingImport) syncPull(false); });
})();
</script>

<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
